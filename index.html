<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="WebNative — a home for the open web.">
  <title>WebNative</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #172033;
      --muted: #64748b;
      --accent: #2864dc;
      --surface: #ffffff;
      --background: #f5f8ff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      color: var(--ink);
      background: radial-gradient(ellipse at 50% 0%, #e1ebff 0, var(--background) 55%);
      font: 16px/1.6 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    header, main, footer { width: min(100% - 2rem, 1080px); margin-inline: auto; }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-block: 1.5rem;
    }

    .brand { color: var(--ink); font-size: 1.1rem; font-weight: 750; text-decoration: none; letter-spacing: -0.03em; }
    nav a { color: var(--muted); font-weight: 600; text-decoration: none; }
    nav a:hover, nav a:focus-visible { color: var(--accent); }

    main { flex: 1; display: grid; place-items: center; padding-block: 4rem; }

    .hero {
      width: min(100%, 760px);
      padding: clamp(2rem, 7vw, 5rem);
      text-align: center;
      background: color-mix(in srgb, var(--surface) 88%, transparent);
      border: 1px solid #dce5f5;
      border-radius: 1.5rem;
      box-shadow: 0 24px 70px #263b6714;
    }

    .eyebrow { margin: 0 0 1rem; color: var(--accent); font-size: .78rem; font-weight: 750; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(2.8rem, 9vw, 5.5rem); line-height: 1.05; letter-spacing: -.065em; }
    .intro { max-width: 560px; margin: 1.5rem auto 0; color: var(--muted); font-size: clamp(1.05rem, 2.5vw, 1.25rem); }
    .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: .8rem; margin-top: 2rem; }
    .button { display: inline-flex; min-height: 3rem; align-items: center; justify-content: center; padding: .7rem 1.15rem; border: 1px solid #d3dced; border-radius: .7rem; color: var(--ink); font-weight: 700; text-decoration: none; }
    .button.primary { border-color: var(--accent); color: #fff; background: var(--accent); }
    .button:hover { transform: translateY(-1px); }
    .button:focus-visible, a:focus-visible { outline: 3px solid #8bb0ff; outline-offset: 3px; }

    footer { padding-block: 1.5rem; color: var(--muted); font-size: .9rem; text-align: center; }

    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; } }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="./" aria-label="WebNative home">WebNative</a>
    <nav aria-label="Main navigation">
      <a href="https://github.com/garyramah/website_WebNative">GitHub</a>
    </nav>
  </header>

  <main>
    <section class="hero" aria-labelledby="page-title">
      <p class="eyebrow">A home for the open web</p>
      <h1 id="page-title">Welcome to WebNative.</h1>
      <p class="intro">A simple starting point for something new. Explore the project, follow along, and help shape what comes next.</p>
      <div class="actions">
        <a class="button primary" href="https://github.com/garyramah/website_WebNative">Explore the project</a>
        <a class="button" href="https://github.com/garyramah/website_WebNative/issues">Get involved</a>
      </div>
    </section>
  </main>

  <footer>Built for the web, by the WebNative community.</footer>
</body>
</html>
